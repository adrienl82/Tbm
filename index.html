<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TBM Temps Reel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="app">
      <button id="home-link" type="button">
        <img src="img/tbm-logo.png" alt="TBM Temps Reel" />
      </button>

      <!-- form="search-form" keeps these part of the search form's GET
           encoding even though they're placed outside it, so the filter
           stays visible and usable from every screen (search, board,
           favorites), not just above the search results. -->
      <div class="mode-filters">
        <label><input type="checkbox" id="filter-tram" name="modes" value="tram" form="search-form" checked /> Tram</label>
        <label><input type="checkbox" id="filter-bus" name="modes" value="bus" form="search-form" checked /> Bus</label>
      </div>

      <section id="screen-search">
        <form id="search-form" method="get">
          <input
            id="search-input"
            name="arret"
            type="search"
            autocomplete="off"
            placeholder="Rechercher un arret (ex: Quinconces)"
          />
        </form>
        <ul id="search-results" class="stop-list"></ul>
        <button id="go-favorites" class="secondary">Mes favoris</button>
      </section>

      <section id="screen-board" hidden>
        <header class="board-header">
          <button id="back-from-board" class="link">&lt; Retour</button>
          <h2 id="board-title"></h2>
          <button id="favorite-toggle" class="link">&#9734; Ajouter aux favoris</button>
        </header>
        <p id="board-status" class="status"></p>
        <ul id="board-passages" class="passage-list"></ul>
      </section>

      <section id="screen-favorites" hidden>
        <header class="board-header">
          <button id="back-from-favorites" class="link">&lt; Retour</button>
          <h2>Mes favoris</h2>
        </header>
        <ul id="favorites-list" class="stop-list"></ul>
      </section>

      <section id="screen-map" hidden>
        <header class="board-header">
          <button id="back-from-map" class="link">&lt; Retour</button>
          <h2 id="map-title"></h2>
        </header>
        <p id="map-status" class="status"></p>
        <div id="line-map"></div>
        <p id="line-incident" class="status incident" hidden></p>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/protobufjs/7.3.2/protobuf.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
