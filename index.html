<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TBM Temps Reel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="app">
      <button id="home-link" type="button">
        <img src="img/tbm-logo.png" alt="TBM Temps Reel" />
      </button>

      <!-- form="search-form" keeps these part of the search form's GET
           encoding even though they're placed outside it, so the filter
           stays visible and usable from every screen (search, board,
           favorites), not just above the search results. -->
      <div class="mode-filters">
        <label><input type="checkbox" id="filter-tram" name="modes" value="tram" form="search-form" checked /> Tram</label>
        <label><input type="checkbox" id="filter-bus" name="modes" value="bus" form="search-form" checked /> Bus</label>
      </div>

      <section id="screen-search">
        <form id="search-form" method="get">
          <input
            id="search-input"
            name="arret"
            type="search"
            autocomplete="off"
            placeholder="Rechercher un arret (ex: Quinconces)"
          />
        </form>
        <ul id="search-results" class="stop-list"></ul>
        <button id="go-favorites" class="secondary">Mes favoris</button>
      </section>

      <section id="screen-board" hidden>
        <header class="board-header">
          <button id="back-from-board" class="link">&lt; Retour</button>
          <h2 id="board-title"></h2>
          <button id="favorite-toggle" class="link">&#9734; Ajouter aux favoris</button>
        </header>
        <p id="board-status" class="status"></p>
        <ul id="board-passages" class="passage-list"></ul>
      </section>

      <section id="screen-favorites" hidden>
        <header class="board-header">
          <button id="back-from-favorites" class="link">&lt; Retour</button>
          <h2>Mes favoris</h2>
        </header>
        <ul id="favorites-list" class="stop-list"></ul>
      </section>

      <section id="screen-map" hidden>
        <header class="board-header">
          <button id="back-from-map" class="link">&lt; Retour</button>
          <h2 id="map-title"></h2>
        </header>
        <p id="map-status" class="status"></p>
        <div id="direction-filters" class="direction-filters" hidden>
          <label><input type="checkbox" id="dir-0" checked /> <span id="dir-0-label">Sens 1</span></label>
          <label><input type="checkbox" id="dir-1" checked /> <span id="dir-1-label">Sens 2</span></label>
        </div>
        <div id="line-map"></div>
        <div id="map-tabs" class="map-tabs" hidden>
          <div id="tab-bar" class="tab-bar" role="tablist">
            <button id="tab-vehicles" class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="pane-vehicles">
              Tous
            </button>
            <!-- one .tab per double-tapped vehicle, added by app.js -->
          </div>
          <div id="pane-vehicles" class="tab-pane" role="tabpanel" aria-labelledby="tab-vehicles">
            <table id="vehicle-stats" class="stats-table" hidden>
              <caption id="vehicle-stats-caption"></caption>
              <thead>
                <tr>
                  <th>Sens</th>
                  <th>Vehicules</th>
                </tr>
              </thead>
              <tbody id="vehicle-stats-body"></tbody>
            </table>
            <p id="line-incident" class="status incident" hidden></p>
          </div>
          <!-- one .tab-pane per double-tapped vehicle, added by app.js -->
        </div>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/protobufjs/7.3.2/protobuf.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
